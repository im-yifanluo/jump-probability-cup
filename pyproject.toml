[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "probcup"
version = "1.0.0"
description = "Calibrated forecasting system and agent-operated pipeline for the Jump Trading Probability Cup (2026 FIFA World Cup)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "requests>=2.31",
    "PyYAML>=6.0",
    "pyarrow>=15",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
figures = ["matplotlib>=3.8"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8"]
deep = ["torch>=2.2"]  # only research/rejected/deep_model

[project.scripts]
probcup = "probcup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
